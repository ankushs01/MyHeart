<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <title>Jantam ami  😌🎉</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <!-- NEW -->
    <style>
        /* ── Yes page layout ── */
        .yes-container {
            padding: 28px 16px 60px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .yes-title {
            font-size: clamp(1.35rem, 5vw, 2.5rem);
            line-height: 1.35;
            color: #d63384;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(214, 51, 132, 0.2);
            animation: bounceTitle 0.7s ease infinite alternate;
        }

        @keyframes bounceTitle {
            from { transform: translateY(0) rotate(-1deg); }
            to   { transform: translateY(-8px) rotate(1deg); }
        }

        /* ── GIF + Photo row ── */
        .gif-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 4vw, 24px);
            flex-wrap: nowrap;
            margin: 0 auto 20px;
        }

        #cat-gif {
            width: clamp(110px, 28vw, 200px);
            height: clamp(110px, 28vw, 200px);
            object-fit: contain;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.15));
            transition: opacity 0.3s ease;
            flex-shrink: 0;
        }

        /* ── Polaroid ── */
        .photo-polaroid {
            background: white;
            padding: clamp(6px, 2vw, 10px) clamp(6px, 2vw, 10px) clamp(20px, 5vw, 32px);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(214,51,132,0.35), 0 2px 8px rgba(0,0,0,0.12);
            transform: rotate(2deg);
            animation: floatPhoto 3s ease-in-out infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }

        .photo-polaroid:hover, .photo-polaroid:active {
            transform: rotate(0deg) scale(1.04);
            box-shadow: 0 16px 40px rgba(214,51,132,0.45);
        }

        .couple-photo {
            width: clamp(95px, 24vw, 160px);
            height: clamp(125px, 32vw, 210px);
            object-fit: cover;
            object-position: center top;
            display: block;
            border-radius: 2px;
        }

        .photo-caption {
            text-align: center;
            margin-top: clamp(5px, 1.5vw, 10px);
            font-size: clamp(0.68rem, 2.2vw, 0.85rem);
            color: #d63384;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            white-space: nowrap;
        }

        @keyframes floatPhoto {
            0%,100% { transform: rotate(2deg) translateY(0); }
            50%      { transform: rotate(2deg) translateY(-6px); }
        }

        /* ── Yes message ── */
        .yes-message {
            font-size: clamp(0.95rem, 3.6vw, 1.4rem);
            color: #e91e8c;
            font-weight: 700;
            margin-top: 16px;
            animation: fadeIn 1s ease 0.5s both;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Birthday toggle ── */
        .birthday-toggle-section {
            margin-top: 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .birthday-toggle-hint {
            font-size: clamp(0.82rem, 3vw, 1rem);
            color: #d63384;
            font-weight: 700;
            font-style: italic;
            opacity: 0.85;
        }

        .toggle {
            display: inline-block;
            position: relative;
            height: 100px;
            width: 100px;
            cursor: pointer;
        }

        .toggle .button {
            transition: all 300ms cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow:
                0 15px 25px -4px rgba(0,0,0,0.5),
                inset 0 -3px 4px -1px rgba(0,0,0,0.2),
                0 -10px 15px -1px rgba(255,255,255,0.6),
                inset 0 3px 4px -1px rgba(255,255,255,0.2),
                inset 0 0 5px 1px rgba(255,255,255,0.8),
                inset 0 20px 30px 0 rgba(255,255,255,0.2);
            border-radius: 68.8px;
            position: absolute;
            background: #eaeaea;
            margin-left: -34.4px;
            margin-top: -34.4px;
            display: block;
            height: 68.8px;
            width: 68.8px;
            left: 50%;
            top: 50%;
        }

        .toggle .label {
            transition: color 300ms ease-out;
            line-height: 101px;
            text-align: center;
            position: absolute;
            font-weight: 700;
            font-size: 28px;
            display: block;
            opacity: 0.9;
            height: 100%;
            width: 100%;
            color: rgba(0,0,0,0.9);
        }

        .toggle input {
            opacity: 0;
            position: absolute;
            cursor: pointer;
            z-index: 1;
            height: 100%;
            width: 100%;
            left: 0;
            top: 0;
        }

        .toggle input:active ~ .button {
            filter: blur(0.5px);
            box-shadow:
                0 12px 25px -4px rgba(0,0,0,0.4),
                inset 0 -8px 30px 1px rgba(255,255,255,0.9),
                0 -10px 15px -1px rgba(255,255,255,0.6),
                inset 0 8px 25px 0 rgba(0,0,0,0.4),
                inset 0 0 10px 1px rgba(255,255,255,0.6);
        }

        .toggle input:active ~ .label  { font-size: 26px; color: rgba(0,0,0,0.45); }

        .toggle input:checked ~ .button {
            filter: blur(0.5px);
            box-shadow:
                0 10px 25px -4px rgba(0,0,0,0.4),
                inset 0 -8px 25px -1px rgba(255,255,255,0.9),
                0 -10px 15px -1px rgba(255,255,255,0.6),
                inset 0 8px 20px 0 rgba(0,0,0,0.2),
                inset 0 0 5px 1px rgba(255,255,255,0.6);
        }

        .toggle input:checked ~ .label { color: rgba(0,0,0,0.8); }

        /* This is to visible the 🐼 button on desktop mode */
        @media (min-width: 601px) {
            .yes-container {
                overflow: visible;
            }
            body {
                overflow-y: auto;
            }
        }
        
    </style>
    <!-- NEW -->
    
    
</head>
<body>
    <div class="hearts-bg"></div>

    <div class="container yes-container">
        <h1 class="yes-title">Jantam jotoe nomuna krs tui amareoi valopas :) 🎉</h1>

        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/eNHbizSfVb0AAAAj/lovemode-cute.gif" alt="celebrating">
            <!-- Photo -->
            <div class="photo-polaroid">
                <img src="Kiss Rupasree.jpeg" alt="ami & tui" class="couple-photo">
                <p class="photo-caption">I Love You 🐼🐻</p>
            </div>
            <!-- Photo -->
        </div>

        <p class="yes-message">I love you Rupasree, 2hr 31 Minutes kuttu 💕</p>
  
        <!-- NEW -->
        <!-- Birthday Toggle -->
        <div class="birthday-toggle-section">
            <p class="birthday-toggle-hint">click kr... ekta surprise ache 🐻</p>
            <div class="toggle">
                <input type="checkbox" id="bday-toggle" onchange="handleToggle(this)">
                <span class="button"></span>
                <span class="label">🐼</span>
            </div>
        </div>
        <!-- NEW -->
        
    </div>

    <audio id="bg-music" loop>
        <!-- <source src="music/beabadoobee - Glue Song (Lyrics).mp3" type="audio/mpeg"> -->
        <!-- <source src="music/I-Love-You-Rupasree.mp3" type="audio/mpeg"> -->
        <source src="music/I-Love-You-Rupasree(Part-2).mp3" type="audio/mpeg">      <!-- Change music-->
    </audio>

    <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

    <script src="yes-script.js"></script>

    <!-- NEW -->
    <script>
        function handleToggle(cb) {
            if (cb.checked) {
                setTimeout(() => { window.location.href = 'birthday.html'; }, 300);
            }
        }
    </script>
    <!-- NEW -->
    
</body>
</html>
